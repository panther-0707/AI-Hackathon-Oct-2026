<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Adventure Maps finds the scenic way between two points that still gets you there on time." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      // apply the saved theme before first paint so there is no flash
      try {
        if (localStorage.getItem("glm-theme") === "light") document.documentElement.classList.remove("dark");
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
